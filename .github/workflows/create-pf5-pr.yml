name: Create PF-5 PR

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head copilot/pf-5-analyse-and-implement \
            --title "feat(PF-5): Implement specialized form widgets" \
            --body "$(cat <<'EOF'
## Summary

Implements PF-5: the \`FormScreenGenerator\` now selects the correct Flutter widget based on the \`@FormField(widget:)\` annotation or infers it from the Dart type when \`FieldWidget.auto\` is used.

## Changes

### \`FieldManifest\`
- Added \`fieldWidget\` (\`FieldWidget\`) — widget hint from \`@FormField.widget\`
- Added \`isEnum\` (\`bool\`) — true when the field's Dart type is an enum

### \`EntityManifest.from()\`
- Reads the \`widget\` value from the \`@FormField\` annotation constant reader
- Detects enum types via \`field.type.element is EnumElement\`

### \`FormScreenGenerator\`
- New private \`_WidgetKind\` enum for the resolved widget type
- \`_resolveWidgetKind()\` maps \`FieldWidget\` + Dart type to a \`_WidgetKind\`
- Dispatches to dedicated writer methods per kind
- State class generation emits the right state variable per kind (\`bool\`, \`DateTime?\`, \`EnumType?\`, \`TextEditingController\`)
- \`dispose()\` only called for fields that have a \`TextEditingController\`

### Widget output per acceptance criterion

| AC | Condition | Generated widget |
|---|---|---|
| #1 | \`bool\` field (auto) | \`SwitchListTile\` |
| #2 | \`DateTime\` field (auto) | \`readOnly\` \`TextFormField\` + \`showDatePicker\` |
| #3 | \`FieldWidget.multilineText\` | \`maxLines: null\` + \`TextInputType.multiline\` |
| #4 | \`FieldWidget.password\` | \`obscureText: true\` \`TextFormField\` |
| #5 | enum field (auto) | \`DropdownButtonFormField<EnumType>\` |
| #6 | \`FieldWidget.toggle\` (any type) | \`SwitchListTile\` |

### Tests
Six new test cases in \`form_screen_generator_test.dart\`, one per acceptance criterion.
EOF
)"
