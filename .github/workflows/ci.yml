name: CI

on:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main" ]

# Restrict default GITHUB_TOKEN permissions to read-only.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # backlog — task status, ids and documentation references agree
  # -------------------------------------------------------------------------
  backlog:
    name: backlog (consistency check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backlog
        run: tool/check_backlog.sh

  # -------------------------------------------------------------------------
  # prefab_flutter — pure-Dart annotations package
  # -------------------------------------------------------------------------
  prefab_flutter:
    name: prefab_flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prefab_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

  # -------------------------------------------------------------------------
  # prefab_flutter_generator — build_runner code generator (pure Dart)
  # -------------------------------------------------------------------------
  prefab_flutter_generator:
    name: prefab_flutter_generator (analyze + test)
    runs-on: ubuntu-latest
    needs: prefab_flutter
    defaults:
      run:
        working-directory: prefab_flutter_generator

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

  # -------------------------------------------------------------------------
  # prefab_flutter_widgets — Flutter runtime widgets package
  # -------------------------------------------------------------------------
  prefab_flutter_widgets:
    name: prefab_flutter_widgets (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prefab_flutter_widgets

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # -------------------------------------------------------------------------
  # prefab_flutter_example — runs the generator and checks the generated code
  # -------------------------------------------------------------------------
  prefab_flutter_example:
    name: prefab_flutter_example (build_runner + analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prefab_flutter_example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (generated code must compile)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
