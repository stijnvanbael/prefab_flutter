name: prefab_flutter_generator
description: Code generator for prefab_flutter. Generates detail screens, list screens, form screens, providers, API clients and routes from @View-annotated Dart classes.
version: 0.1.0
homepage: https://github.com/stijnvanbael/prefab_flutter

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  analyzer: '>=6.0.0 <8.0.0'
  build: ^2.4.0
  prefab_flutter: ^0.1.0
  source_gen: ^1.5.0

# Override prefab_flutter with the local path until it is published to pub.dev.
# Remove this section after the first publish.
dependency_overrides:
  prefab_flutter:
    path: ../prefab_flutter

dev_dependencies:
  build_runner: ^2.4.0
  build_test: ^2.2.0
  lints: ^3.0.0
  test: ^1.24.0
