name: prefab_flutter_example
description: Example app for prefab_flutter with a Product entity and nested Review entities, backed by an in-memory mock API.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: '>=2.5.0 <3.0.0'
  go_router: ^14.0.0
  json_annotation: ^4.9.0
  material_ui: ^1.11.1
  prefab_flutter:
    path: ../prefab_flutter
  prefab_flutter_widgets:
    path: ../prefab_flutter_widgets

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  prefab_flutter_generator:
    path: ../prefab_flutter_generator

dependency_overrides:
  prefab_flutter:
    path: ../prefab_flutter
